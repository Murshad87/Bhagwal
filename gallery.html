<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2c7a7b" />
  <meta name="description" content="Photos of Bhagwal village, its mosques, landmarks, fields, and heritage." />
  <title>Bhagwal Photo Gallery</title>
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  
  <style>
    :root {
      color-scheme: light;
      --primary: #2c7a7b;
      --primary-dark: #1e5c5f;
      --bg: #f6f7f8;
      --text: #1f2a2d;
      --muted: #50656a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }
    header {
      padding: 28px 16px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    }
    header h1 { margin: 0; }
    header p { margin: 8px 0 0; }
    main { max-width: 1200px; margin: auto; padding: 24px 16px; }
    .back-link { display: inline-block; margin-bottom: 18px; color: var(--primary-dark); }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 18px;
    }
    figure {
      margin: 0;
      overflow: hidden;
      border-radius: 14px;
      background: white;
      box-shadow: 0 5px 18px rgba(16, 33, 35, .1);
    }
    figure img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: cover;
    }
    figcaption { padding: 11px 14px; color: var(--muted); }
    .photo-details { padding: 0 14px 14px; color: var(--text); font-size: .92rem; }
    .photo-details p { margin: 0 0 8px; }
    footer { padding: 18px; text-align: center; color: white; background: var(--primary); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Bhagwal Photo Gallery</h1>
    <p>Village scenes, mosques, landmarks, and local heritage</p>
  </header>
  <main>
    <a class="back-link" href="./">← Back to Bhagwal Village</a>
    <div class="gallery" id="gallery" aria-label="Bhagwal village photo gallery">
      <p>Loading photos...</p>
    </div>
    <script>
      async function loadGallery() {
        const container = document.getElementById('gallery');
        try {
          const response = await fetch('/api/gallery');
          if (!response.ok) throw new Error('Could not load gallery');
          const photos = await response.json();
          if (!photos.length) {
            container.innerHTML = '<p>No published photos yet.</p>';
            return;
          }
          container.innerHTML = photos.map(photo => `
            <figure>
              <img src="${photo.image_url}" alt="${photo.title || 'Bhagwal photo'}" loading="lazy">
              <figcaption>${photo.title || ''}</figcaption>
              ${photo.description ? `<div class="photo-details"><p>${photo.description}</p></div>` : ''}
            </figure>
          `).join('');
        } catch (error) {
          container.innerHTML = '<p>Photos are temporarily unavailable.</p>';
        }
      }
      loadGallery();
    </script>
  </main>
  <footer>Bhagwal Village · Digital Village Initiative</footer>
</body>
</html>
